name: Container Security

on:
  push:
    branches:
      - main
      - "learning/**"
    paths:
      - "app/**"
      - "Dockerfile"
      - "Dockerfile.insecure"
      - ".dockerignore"
      - "requirements*.txt"
      - ".github/workflows/container-security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - "Dockerfile.insecure"
      - ".dockerignore"
      - "requirements*.txt"
      - ".github/workflows/container-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: expenseguard:${{ github.sha }}

jobs:
  container-security:
    name: Build, harden, scan, SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build hardened ExpenseGuard image
        run: docker build --tag "$IMAGE_NAME" .

      - name: Verify image is configured for a non-root user
        run: |
          configured_user="$(docker image inspect "$IMAGE_NAME" --format '{{.Config.User}}')"
          echo "Configured image user: $configured_user"
          test "$configured_user" = "10001:10001"

      - name: Smoke test with hardened runtime controls
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop=ALL \
            --security-opt no-new-privileges=true \
            --pids-limit=100 \
            --memory=256m \
            --cpus=1.0 \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE_NAME")"

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              echo "Hardened container health check passed."
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy in time."
          exit 1

      - name: Create full Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expenseguard-container-security-${{ github.sha }}
          path: |
            trivy-image.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Gate fixable HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          format: table
          exit-code: "1"
