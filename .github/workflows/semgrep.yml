name: Semgrep SAST

on:
  push:
    branches:
      - main
      - "learning/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.177.0

      - name: Run Semgrep security scan
        run: semgrep scan --config auto --metrics=off --strict app
